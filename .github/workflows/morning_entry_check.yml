name: Morning 09:30 AM Swing Entry & Mobile Alert

on:
  schedule:
    # 09:30 AM IST (04:00 AM UTC), Monday through Friday
    - cron: '00 04 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub web or mobile app

jobs:
  morning_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run 09:30 AM Entry Check & Dispatch Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python pipeline/tools/run_daily.py --morning --notify --top 5

      - name: Upload Morning Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-entry-report
          path: data/reports/morning_entry_*.json
          retention-days: 7

