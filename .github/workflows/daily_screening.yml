name: Daily Evening Screening Pipeline

on:
  schedule:
    # 17:48 IST (12:18 UTC), Monday through Friday (offset from :00/:15 to avoid GitHub public queue congestion)
    - cron: '18 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub web or mobile app

jobs:
  screen_universe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Evening Screening
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python pipeline/tools/run_daily.py --notify --top 5

      - name: Upload Screening Reports & Tracking Sheet
        uses: actions/upload-artifact@v4
        with:
          name: screening-reports
          path: |
            data/reports/
            data/tracking/
          retention-days: 14

      - name: Commit and Push Updated Reports, Tracking Sheet & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/history/ data/bhavcopy/ data/bse/ data/fo/ data/tracking/
          git diff --staged --quiet || git commit -m "Auto: Daily screening report & tracking $(date +'%Y-%m-%d') [skip ci]"
          git push || echo "No changes to push or push failed"
